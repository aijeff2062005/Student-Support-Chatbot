[project]
name = "admission-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "colorlog>=6.10.1",
    "fastapi>=0.135.3",
    "google-adk>=1.30.0",
    "google-genai>=1.73.1",
    "greenlet>=3.4.0",
    "httpx>=0.28.1",
    "langchain-core>=1.2.30",
    "langfuse>=4.2.0",
    "litellm>=1.83.0",
    "mcp>=1.27.0",
    "neo4j>=6.1.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.13.0.92",
    "openinference-instrumentation-google-adk>=0.1.10",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymilvus>=2.6.12",
    "pymongo>=4.16.0",
    "python-multipart>=0.0.26",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "starlette>=0.52.1",
    "uvicorn>=0.44.0",
    "zxing-cpp>=3.0.0",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "ty>=0.0.31",
]

[tool.ty.src]
exclude = ["tests/**"]
