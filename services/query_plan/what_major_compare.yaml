version: "1.0"
flow_name: "what_major_compare"
description: >
  Major/Specialization/AcademicProgram-specific WHAT-COMPARE workflow.
  Used for questions such as "So sánh ngành A với ngành B" where both sides
  are academic program entities.

  Strategy:
  - Phase 1: Resolve the base major/specialization and compare targets.
  - Phase 2: Normalize every compared entity back to the Major-rooted academic
    tree, then collect direct AcademicProgram data; if direct programs do not
    exist, expand Major -> Specialization -> AcademicProgram.
  - Phase 3: Fall back to legacy AcademicProgram lookup only when the
    Major-rooted structured comparison is empty.
  - Phase 4: Fall back to crawled data only when structured comparison is empty.

steps:
  # ════════════════════════════════════════════════════════════════
  # PHASE 1 — RESOLVE COMPARED MAJORS/SPECIALIZATIONS
  # ════════════════════════════════════════════════════════════════

  - step_id: "P1_S1"
    name: "prepare_primary_entities"
    description: "Normalize the first compared major/specialization/program."
    module: "dbs.graph_search_helpers"
    function: "prepare_entities_for_search"
    inputs:
      entities: "$input.primary_entities"
      expand_types: true
    outputs: "primary_search_params"

  - step_id: "P1_S2"
    name: "resolve_primary_entity"
    description: "Resolve the first compared side to a canonical academic node."
    module: "dbs.milvus_helper"
    function: "search_entity_by_name"
    inputs:
      entity_name: "$state.primary_search_params.entity_name"
      entity_type: "$state.primary_search_params.entity_type"
      keywords: "$input.keywords"
      top_k: 1
      threshold: 0.75
      time: "$input.time"
    outputs: "primary_found_list"

  - step_id: "P1_S3"
    name: "prepare_compare_targets"
    description: "Normalize all remaining compared academic entities."
    module: "dbs.graph_search_helpers"
    function: "prepare_entities_for_search"
    inputs:
      entities: "$input.compare_targets"
      expand_types: true
    outputs: "compare_search_params"

  - step_id: "P1_S4"
    name: "resolve_compare_target_entities"
    description: "Resolve compare targets individually to preserve user order."
    module: "dbs.graph_search_helpers"
    function: "resolve_entities_individually"
    inputs:
      entity_names: "$state.compare_search_params.entity_name"
      entity_types: "$state.compare_search_params.entity_type"
      keywords: "$input.keywords"
      top_k: 1
      threshold: 0.75
      time: "$input.time"
    outputs: "compare_found_list"

  # ════════════════════════════════════════════════════════════════
  # PHASE 2 — MAJOR-ROOTED PROGRAM TREE
  # Mirrors what_ops_major_spec_academic:
  # resolved graph nodes → parent Major → direct AcademicProgram, else
  # Specialization → AcademicProgram → canonical compare_results rows.
  # ════════════════════════════════════════════════════════════════

  - step_id: "P2_S1"
    name: "merge_major_compare_found_lists"
    description: "Merge resolved base and compare entities in user order."
    condition: "$state.primary_found_list is not None and len($state.primary_found_list) > 0 and $state.compare_found_list is not None and len($state.compare_found_list) > 0"
    module: "dbs.what_ops_major_spec_academic"
    function: "merge_major_compare_found_lists"
    inputs:
      primary_found_list: "$state.primary_found_list"
      compare_found_list: "$state.compare_found_list"
    outputs: "major_compare_found_list"

  - step_id: "P2_S2"
    name: "build_major_program_compare_results"
    description: "Build compare_results from the Major-rooted AcademicProgram/Specialization tree."
    condition: "$state.major_compare_found_list is not None and len($state.major_compare_found_list) > 0"
    module: "dbs.what_ops_major_spec_academic"
    function: "build_major_program_compare_results"
    inputs:
      found_list: "$state.major_compare_found_list"
      keyword_attributes: "$input.keyword_attributes"
      attribute_keys:
        - "description"
        - "objective"
        - "mission"
        - "key_points"
        - "career_opportunities"
        - "further_study_opportunities"
        - "training_duration"
        - "total_credits"
        - "education_level"
        - "training_mode"
        - "teaching_learning_method"
        - "graduation_requirements"
        - "knowledge_blocks"
        - "education_philosophy"
        - "name_en"
        - "faculty_name"
        - "major_code"
        - "major_name_vi"
      time: "$input.time"
    outputs: "compare_results"

  # ════════════════════════════════════════════════════════════════
  # PHASE 3 — ACADEMICPROGRAM FALLBACK
  # Used only when canonical Major/Specialization attributes are empty.
  # ════════════════════════════════════════════════════════════════

  - step_id: "P3_S1"
    name: "fetch_primary_academic_program_rows"
    description: "Fetch AcademicProgram comparison attributes for the base major/specialization."
    condition: "not $state.compare_results and $state.primary_found_list is not None and len($state.primary_found_list) > 0"
    module: "dbs.graph_search_helpers"
    function: "resolve_academic_program_compare_rows"
    inputs:
      found_list: "$state.primary_found_list"
      attribute_list:
        - "description"
        - "objective"
        - "mission"
        - "key_points"
        - "career_opportunities"
        - "further_study_opportunities"
        - "training_duration"
        - "total_credits"
        - "education_level"
        - "teaching_learning_method"
        - "graduation_rate"
        - "graduate_employment_rate"
        - "fee_information"
      time: "$input.time"
    outputs: "primary_academic_program_rows"

  - step_id: "P3_S2"
    name: "fetch_compare_academic_program_rows"
    description: "Fetch AcademicProgram comparison attributes for all compare targets."
    condition: "not $state.compare_results and $state.compare_found_list is not None and len($state.compare_found_list) > 0"
    module: "dbs.graph_search_helpers"
    function: "resolve_academic_program_compare_rows"
    inputs:
      found_list: "$state.compare_found_list"
      attribute_list:
        - "description"
        - "objective"
        - "mission"
        - "key_points"
        - "career_opportunities"
        - "further_study_opportunities"
        - "training_duration"
        - "total_credits"
        - "education_level"
        - "teaching_learning_method"
        - "graduation_rate"
        - "graduate_employment_rate"
        - "fee_information"
      time: "$input.time"
    outputs: "compare_academic_program_rows"

  # ════════════════════════════════════════════════════════════════
  # PHASE 4 — CRAWLED-DATA FALLBACK
  # ════════════════════════════════════════════════════════════════

