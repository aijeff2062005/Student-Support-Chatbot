version: "1.0"
flow_name: "what_relation_compare"
description: >
  Workflow for WHAT-RELATION queries that compare the same relation across
  multiple explicit objects without time comparison. It resolves the relation
  carrier once, resolves the base object plus all compare targets, builds one
  relation snapshot per object by reusing the existing relation retrieval path,
  then merges them into one canonical relation result with a formatted
  comparison backbone for downstream answer generation.

  Strategy:
  - Phase 1: Resolve the relation carrier, the base object, and all compare objects.
  - Phase 2: Fetch one relation snapshot per object using fetch_relation_snapshot.
  - Phase 3: Merge all snapshots into one relation context and emit a formatted comparison answer.
  - Phase 4: Fall back to crawled data only when all structured snapshots are empty.

steps:
  # ════════════════════════════════════════════════════════════════
  # PHASE 1 — RESOLVE RELATION CARRIER AND COMPARE OBJECTS
  # context_entities   → relation carrier (e.g. học phí, điểm chuẩn)
  # primary_entities   → base object
  # compare_targets    → remaining compared objects
  # ════════════════════════════════════════════════════════════════

  - step_id: "P1_S1"
    name: "prepare_relation_carrier"
    description: "Normalize the relation carrier into search-ready parameters."
    module: "dbs.graph_search_helpers"
    function: "prepare_entities_for_search"
    inputs:
      entities: "$input.context_entities"
      expand_types: true
    outputs: "relation_search_params"

  - step_id: "P1_S2"
    name: "resolve_relation_carrier"
    description: "Resolve the relation carrier once for all compared objects."
    module: "dbs.milvus_helper"
    function: "search_entity_by_name"
    inputs:
      entity_name: "$state.relation_search_params.entity_name"
      entity_type: "$state.relation_search_params.entity_type"
      top_k: 2
      threshold: 0.7
      time: "$input.time"
    outputs: "context_found_list"

  - step_id: "P1_S3"
    name: "prepare_primary_entities"
    description: "Normalize the base compared object into search-ready parameters."
    module: "dbs.graph_search_helpers"
    function: "prepare_entities_for_search"
    inputs:
      entities: "$input.primary_entities"
      expand_types: true
    outputs: "primary_search_params"

  - step_id: "P1_S4"
    name: "resolve_primary_entity"
    description: "Resolve the base compared object."
    module: "dbs.milvus_helper"
    function: "search_entity_by_name"
    inputs:
      entity_name: "$state.primary_search_params.entity_name"
      entity_type: "$state.primary_search_params.entity_type"
      top_k: 1
      threshold: 0.75
      time: "$input.time"
    outputs: "primary_found_list"

  - step_id: "P1_S5"
    name: "prepare_compare_targets"
    description: "Normalize the compare targets into search-ready parameters."
    module: "dbs.graph_search_helpers"
    function: "prepare_entities_for_search"
    inputs:
      entities: "$input.compare_targets"
      expand_types: true
    outputs: "compare_search_params"

  - step_id: "P1_S6"
    name: "resolve_compare_targets"
    description: "Resolve each compare target individually to preserve order."
    module: "dbs.graph_search_helpers"
    function: "resolve_entities_individually"
    inputs:
      entity_names: "$state.compare_search_params.entity_name"
      entity_types: "$state.compare_search_params.entity_type"
      top_k: 1
      threshold: 0.75
      time: "$input.time"
    outputs: "compare_found_list"

  # ════════════════════════════════════════════════════════════════
  # PHASE 2 — FETCH RELATION SNAPSHOTS
  # Reuse fetch_relation_snapshot with object-as-context and relation-as-primary.
  # ════════════════════════════════════════════════════════════════

  - step_id: "P2_S1"
    name: "fetch_base_relation_snapshot"
    description: "Fetch the relation snapshot for the base compared object."
    condition: "$state.primary_found_list is not None and len($state.primary_found_list) > 0 and $state.context_found_list is not None and len($state.context_found_list) > 0"
    module: "dbs.graph_search_helpers"
    function: "fetch_relation_snapshot"
    inputs:
      context_found_list: "$state.primary_found_list"
      primary_found_list: "$state.context_found_list"
      primary_topic: "$input.primary_topic"
      subtopics: "$input.subtopics"
      time: "$input.time"
    outputs: "base_subgraph"

  - step_id: "P2_S2"
    name: "compact_base_relation_context"
    description: "Compact the base relation snapshot into answer-ready relation context."
    condition: "$state.base_subgraph is not None"
    module: "dbs.graph_search_helpers"
    function: "compact_relation_results"
    inputs:
      subgraph: "$state.base_subgraph"
      original_query: "$input.original_query"
      max_candidates: 15
      max_rel_samples: 5
    outputs: "base_relation_context"

  - step_id: "P2_S3"
    name: "fetch_compare_relation_entries"
    description: "Fetch and compact one relation snapshot for each compare object."
    condition: "$state.compare_found_list is not None and len($state.compare_found_list) > 0 and $state.context_found_list is not None and len($state.context_found_list) > 0"
    module: "dbs.graph_search_helpers"
    function: "fetch_relation_contexts_for_targets"
    inputs:
      target_found_list: "$state.compare_found_list"
      relation_found_list: "$state.context_found_list"
      primary_topic: "$input.primary_topic"
      subtopics: "$input.subtopics"
      time: "$input.time"
      original_query: "$input.original_query"
      max_candidates: 15
      max_rel_samples: 5
    outputs: "compare_relation_entries"

  # ════════════════════════════════════════════════════════════════
  # PHASE 3 — MERGE SNAPSHOTS INTO ONE CANONICAL RELATION RESULT
  # ════════════════════════════════════════════════════════════════

  - step_id: "P3_S1"
    name: "merge_multi_relation_compare_contexts"
    description: "Merge the base and compare snapshots into one relation context."
    condition: "($state.base_relation_context is not None and len($state.base_relation_context) > 0) or ($state.compare_relation_entries is not None and len($state.compare_relation_entries) > 0)"
    module: "dbs.graph_search_helpers"
    function: "merge_multi_relation_compare_contexts"
    inputs:
      base_relation_context: "$state.base_relation_context"
      base_label: "$state.primary_found_list.0.node_name"
      compare_relation_entries: "$state.compare_relation_entries"
      relation_context_override: "$state.context_found_list.0"
      original_query: "$input.original_query"
    outputs: "relation_context"

  - step_id: "P3_S2"
    name: "build_multi_relation_compare_answer"
    description: "Build a formatted relation answer backbone for multiple compared objects."
    condition: "$state.relation_context is not None and len($state.relation_context) > 0"
    module: "dbs.graph_search_helpers"
    function: "build_multi_relation_compare_answer"
    inputs:
      relation_context: "$state.relation_context"
      base_label: "$state.primary_found_list.0.node_name"
      base_relation_context: "$state.base_relation_context"
      compare_relation_entries: "$state.compare_relation_entries"
      relation_found_list: "$state.context_found_list"
      original_query: "$input.original_query"
    outputs: "relation_answer_data"

  # ════════════════════════════════════════════════════════════════
  # PHASE 4 — CRAWLED-DATA FALLBACK
  # ════════════════════════════════════════════════════════════════

  - step_id: "P4_S1"
    name: "crawled_data_search"
    description: "Search crawled data only when all structured relation snapshots are empty."
    condition: "not $state.relation_context and not any(entity.get('label') in ['Policy', 'AdmissionPolicy'] for entity in ($input.primary_entities or [])) and not any(entity.get('label') in ['Policy', 'AdmissionPolicy'] for entity in ($input.context_entities or []))"
    module: "dbs.milvus_helper"
    function: "search_crawled_data"
    inputs:
      question: "$input.original_query"
      top_k: 5
    outputs: "crawled_data_results"

  - step_id: "P4_S2"
    name: "generate_crawled_data"
    description: "Generate crawled data only when all structured non-time relation compare paths are empty."
    condition: "not $state.relation_context and not $state.crawled_data_results and not any(entity.get('label') in ['Policy', 'AdmissionPolicy'] for entity in ($input.primary_entities or [])) and not any(entity.get('label') in ['Policy', 'AdmissionPolicy'] for entity in ($input.context_entities or []))"
    module: "dbs.milvus_helper"
    function: "generate_and_save_crawled_data"
    inputs:
      question: "$input.original_query"
      collection_name: "knowledge_university_crawled_data"
    outputs: "crawled_data_results"
