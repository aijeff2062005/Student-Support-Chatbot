version: "1.0"
flow_name: "how_policy_procedure"
description: >
  Workflow for STUDENT-CENTRIC HOW questions about the requirements, action steps, 
  and procedures required for a student to execute or satisfy a policy.

  Strategy:
  - Phase 1: Retrieve core policy identification (identity and metadata).
  - Phase 2: Retrieve student actions and eligibility criteria.
  
  Fallback policy:
  - Prioritize 'student_action' and 'requirements' for student-facing context.
  - If 'student_action' is null/missing, fallback to retrieve 'process' alongside 
    'requirements' so the Response Composer can safely parse student-relevant instructions 
    without exposing internal admin workflows.

supported_entity_types:
  - Policy
requires_entity_id: true

traversal_steps:
  # PHASE 1 - POLICY IDENTITY & CORE OVERVIEW
  - step: 1
    name: "policy_overview"
    description: "Fetch the core policy identification fields for contextual grounding."
    cypher_template: >
      MATCH (p:Policy)
      WHERE p.id = $entity_id
      RETURN p.name, p.description, p.type
    attributes:
      - name
      - description
      - type

  # PHASE 2 - STUDENT ACTIONS & RICH CONTEXT (WITH PROCESS FALLBACK)
  - step: 2
    name: "policy_rich_context"
    description: >
      Fetch student-specific actions and requirements. Returns internal handling 'process' 
      as a contextual fallback if 'student_action' is empty.
    cypher_template: >
      MATCH (p:Policy)
      WHERE p.id = $entity_id
      RETURN p.student_action, p.requirements, p.process
    attributes:
      - student_action
      - requirements
      - process