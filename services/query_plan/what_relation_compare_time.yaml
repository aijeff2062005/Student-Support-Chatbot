version: "1.0"
flow_name: "what_relation_compare_time"
description: >
  Workflow for WHAT-RELATION queries that compare the same relation across two
  explicit years. It resolves the shared scope once using `time.from_year`,
  resolves each relation side against its own comparison year, builds two
  relation snapshots, then merges them into one canonical relation result with
  a preformatted comparison summary for downstream answer generation.

  Strategy:
  - Phase 1: Build time windows, resolve shared context, and resolve the left
    and right relation carriers separately.
  - Phase 2: Fetch one relation snapshot per year using the existing
    what_relation ID-based retrieval logic.
  - Phase 3: Compact both snapshots, merge them into one relation context, and
    emit a formatted comparison backbone.
  - Phase 4: Fall back to crawled data only when both structured snapshots are empty.

steps:
  # ════════════════════════════════════════════════════════════════
  # PHASE 1 — BUILD TIME WINDOWS AND RESOLVE INPUTS
  # Context uses ONLY input.time.from_year as agreed.
  # ════════════════════════════════════════════════════════════════

  - step_id: "P1_S0"
    name: "build_time_compare_windows"
    description: "Build context/left/right year windows for time-based relation comparison."
    module: "dbs.graph_search_helpers"
    function: "build_time_compare_windows"
    inputs:
      time: "$input.time"
      time_compare: "$input.time_compare"
    outputs: "time_windows"

  - step_id: "P1_S1"
    name: "resolve_context_entities"
    description: "Resolve the shared relation scope using only time.from_year."
    module: "dbs.milvus_helper"
    function: "search_entity_by_name"
    inputs:
      entity_name: "$input.context_entities[*].text"
      entity_type: "$input.context_entities[*].label"
      top_k: 1
      threshold: 0.75
      time: "$state.time_windows.context_time"
    outputs: "context_found_list"

  - step_id: "P1_S2"
    name: "prepare_primary_entities"
    description: "Normalize the left compare-side entity for search by stripping its time marker."
    module: "dbs.graph_search_helpers"
    function: "prepare_time_compare_entities_for_search"
    inputs:
      entities: "$input.primary_entities"
      raw_marker: "$input.time_compare.from_raw"
      resolved_year: "$input.time_compare.from_year"
      expand_types: true
    outputs: "primary_search_params"

  - step_id: "P1_S3"
    name: "resolve_primary_entities"
    description: "Resolve the left compare-side relation carrier against the left year."
    module: "dbs.milvus_helper"
    function: "search_entity_by_name"
    inputs:
      entity_name: "$state.primary_search_params.entity_name"
      entity_type: "$state.primary_search_params.entity_type"
      top_k: 2
      threshold: 0.7
      time: "$state.time_windows.left_time"
    outputs: "primary_found_list"

  - step_id: "P1_S4"
    name: "prepare_compare_targets"
    description: "Normalize the right compare-side entity for search by stripping its time marker."
    module: "dbs.graph_search_helpers"
    function: "prepare_time_compare_entities_for_search"
    inputs:
      entities: "$input.compare_targets"
      raw_marker: "$input.time_compare.to_raw"
      resolved_year: "$input.time_compare.to_year"
      expand_types: true
    outputs: "compare_search_params"

  - step_id: "P1_S5"
    name: "resolve_compare_targets"
    description: "Resolve the right compare-side relation carrier against the right year."
    module: "dbs.milvus_helper"
    function: "search_entity_by_name"
    inputs:
      entity_name: "$state.compare_search_params.entity_name"
      entity_type: "$state.compare_search_params.entity_type"
      top_k: 2
      threshold: 0.7
      time: "$state.time_windows.right_time"
    outputs: "compare_found_list"

  - step_id: "P1_S6"
    name: "coalesce_primary_entities"
    description: "If the left side did not resolve but the right side did, reuse the right canonical entity."
    condition: "$state.primary_found_list is  None and $state.compare_found_list is not None and len($state.compare_found_list) > 0"
    module: "dbs.graph_search_helpers"
    function: "coalesce_time_compare_primary_entities"
    inputs:
      primary_found_list: "$state.primary_found_list"
      compare_found_list: "$state.compare_found_list"
    outputs: "primary_found_list"

  - step_id: "P1_S7"
    name: "coalesce_compare_entities"
    description: "If the right side did not resolve but the left side did, reuse the left canonical entity."
    condition: "$state.compare_found_list is  None and $state.primary_found_list is not None and len($state.primary_found_list) > 0"
    module: "dbs.graph_search_helpers"
    function: "coalesce_time_compare_compare_entities"
    inputs:
      primary_found_list: "$state.primary_found_list"
      compare_found_list: "$state.compare_found_list"
    outputs: "compare_found_list"

  # ════════════════════════════════════════════════════════════════
  # PHASE 2 — FETCH ONE RELATION SNAPSHOT PER YEAR
  # Reuses the existing what_relation ID-based retrieval strategy.
  # ════════════════════════════════════════════════════════════════

  - step_id: "P2_S1"
    name: "fetch_left_relation_snapshot"
    description: "Fetch the relation snapshot for the left comparison year."
    condition: "$state.context_found_list is not None and len($state.context_found_list) > 0 and $state.primary_found_list is not None and len($state.primary_found_list) > 0"
    module: "dbs.graph_search_helpers"
    function: "fetch_relation_snapshot"
    inputs:
      context_found_list: "$state.context_found_list"
      primary_found_list: "$state.primary_found_list"
      primary_topic: "$input.primary_topic"
      subtopics: "$input.subtopics"
      time: "$state.time_windows.left_time"
    outputs: "left_subgraph"

  - step_id: "P2_S2"
    name: "compact_left_relation_context"
    description: "Compact the left relation snapshot into answer-ready relation context."
    condition: "$state.left_subgraph is not None"
    module: "dbs.graph_search_helpers"
    function: "compact_relation_results"
    inputs:
      subgraph: "$state.left_subgraph"
      original_query: "$input.original_query"
      max_candidates: 15
      max_rel_samples: 5
    outputs: "left_relation_context"

  - step_id: "P2_S3"
    name: "fetch_right_relation_snapshot"
    description: "Fetch the relation snapshot for the right comparison year."
    condition: "$state.context_found_list is not None and len($state.context_found_list) > 0 and $state.compare_found_list is not None and len($state.compare_found_list) > 0"
    module: "dbs.graph_search_helpers"
    function: "fetch_relation_snapshot"
    inputs:
      context_found_list: "$state.context_found_list"
      primary_found_list: "$state.compare_found_list"
      primary_topic: "$input.primary_topic"
      subtopics: "$input.subtopics"
      time: "$state.time_windows.right_time"
    outputs: "right_subgraph"

  - step_id: "P2_S4"
    name: "compact_right_relation_context"
    description: "Compact the right relation snapshot into answer-ready relation context."
    condition: "$state.right_subgraph is not None"
    module: "dbs.graph_search_helpers"
    function: "compact_relation_results"
    inputs:
      subgraph: "$state.right_subgraph"
      original_query: "$input.original_query"
      max_candidates: 15
      max_rel_samples: 5
    outputs: "right_relation_context"

  # ════════════════════════════════════════════════════════════════
  # PHASE 3 — MERGE SNAPSHOTS INTO ONE CANONICAL RELATION RESULT
  # ════════════════════════════════════════════════════════════════

  - step_id: "P3_S1"
    name: "merge_relation_compare_contexts"
    description: "Merge the left and right snapshots into one relation context."
    condition: "$state.left_relation_context is not None or $state.right_relation_context is not None"
    module: "dbs.graph_search_helpers"
    function: "merge_relation_compare_contexts"
    inputs:
      left_relation_context: "$state.left_relation_context"
      right_relation_context: "$state.right_relation_context"
      left_label: "$state.time_windows.left_label"
      right_label: "$state.time_windows.right_label"
      original_query: "$input.original_query"
    outputs: "relation_context"

  - step_id: "P3_S2"
    name: "build_relation_compare_answer"
    description: "Build a formatted relation answer backbone for the two compared years."
    condition: "$state.relation_context is not None"
    module: "dbs.graph_search_helpers"
    function: "build_relation_compare_answer"
    inputs:
      relation_context: "$state.relation_context"
      left_relation_context: "$state.left_relation_context"
      right_relation_context: "$state.right_relation_context"
      primary_found_list: "$state.primary_found_list"
      compare_found_list: "$state.compare_found_list"
      time_windows: "$state.time_windows"
      original_query: "$input.original_query"
    outputs: "relation_answer_data"

  # ════════════════════════════════════════════════════════════════
  # PHASE 4 — CRAWLED-DATA FALLBACK
  # ════════════════════════════════════════════════════════════════

  - step_id: "P4_S1"
    name: "crawled_data_search"
    description: "Search crawled data only when both structured relation snapshots are empty."
    condition: "not $state.left_relation_context and not $state.right_relation_context and not any(entity.get('label') in ['Policy', 'AdmissionPolicy'] for entity in ($input.primary_entities or [])) and not any(entity.get('label') in ['Policy', 'AdmissionPolicy'] for entity in ($input.context_entities or []))"
    module: "dbs.milvus_helper"
    function: "search_crawled_data"
    inputs:
      question: "$input.original_query"
      top_k: 5
    outputs: "crawled_data_results"

  - step_id: "P4_S2"
    name: "generate_crawled_data"
    description: "Generate crawled data only when all structured time-compare paths are empty."
    condition: "not $state.left_relation_context and not $state.right_relation_context and not $state.crawled_data_results and not any(entity.get('label') in ['Policy', 'AdmissionPolicy'] for entity in ($input.primary_entities or [])) and not any(entity.get('label') in ['Policy', 'AdmissionPolicy'] for entity in ($input.context_entities or []))"
    module: "dbs.milvus_helper"
    function: "generate_and_save_crawled_data"
    inputs:
      question: "$input.original_query"
      collection_name: "knowledge_university_crawled_data"
    outputs: "crawled_data_results"
